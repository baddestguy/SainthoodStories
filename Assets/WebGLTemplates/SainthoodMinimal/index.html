<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
        }

        /* Loader overlay */
        #unity-loading-root {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #b8563f;
        }

        #unity-loading-bar-container {
            width: 60vw;
            max-width: 400px;
            height: 16px;
            border: 1px solid #b8563f;
            background: #222222;
            box-sizing: border-box;
            margin: 0 auto;
        }

        #unity-loading-bar {
            width: 0%;
            height: 100%;
            background: #b8563f;
            transition: width 0.1s linear;
        }

        #unity-loading-text {
            margin-top: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body style="text-align: center; padding: 0; border: 0; margin: 0;">

    <!-- Simple loading UI -->
    <div id="unity-loading-root">
        <div id="unity-loading-bar-container">
            <div id="unity-loading-bar"></div>
        </div>
        <div id="unity-loading-text">Loading... 0%</div>
    </div>

    <!-- Unity canvas -->
    <canvas id="unity-canvas"
            width={{{ WIDTH }}}
            height={{{ HEIGHT }}}
            tabindex="-1"
            style="width: {{{ WIDTH }}}px;
                   height: {{{ HEIGHT }}}px;
                   background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/\'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}"></canvas>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Mobile sizing logic from Minimal template
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      var canvas = document.querySelector("#unity-canvas");
      var loadingRoot = document.getElementById("unity-loading-root");
      var loadingBar = document.getElementById("unity-loading-bar");
      var loadingText = document.getElementById("unity-loading-text");

      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      };

      createUnityInstance(canvas, config, function (progress) {
        // progress is 0..1
        var pct = Math.round(progress * 100);
        loadingBar.style.width = pct + "%";
        loadingText.textContent = "Loading... " + pct + "%";
      }).then(function (unityInstance) {
        // hide loader when done
        if (loadingRoot) {
          loadingRoot.style.display = "none";
        }
      }).catch(function (message) {
        console.error(message);
        if (loadingText) {
          loadingText.textContent = "Error loading: " + message;
        }
      });
    </script>
</body>
</html>
